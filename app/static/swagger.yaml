swagger: "2.0"
info:
  title: "CodingLab API"
  description: "Authenticated API for students, teachers, lessons, sessions, and user accounts."
  version: "2.0.0"
basePath: "/"
consumes: ["application/json"]
produces: ["application/json"]
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
paths:
  /users/register:
    post:
      tags: [Users]
      summary: "Register a student account"
      parameters: [{$ref: "#/parameters/RegisterBody"}]
      responses:
        201: {description: "Student account created", schema: {$ref: "#/definitions/User"}}
        400: {description: "Invalid request", schema: {$ref: "#/definitions/Error"}}
        409: {description: "Email already registered", schema: {$ref: "#/definitions/Error"}}
  /users/login:
    post:
      tags: [Users]
      summary: "Log in and receive an access token"
      parameters: [{$ref: "#/parameters/LoginBody"}]
      responses:
        200: {description: "Login successful", schema: {$ref: "#/definitions/LoginResponse"}}
        401: {description: "Invalid email or password", schema: {$ref: "#/definitions/Error"}}
  /users/me:
    get:
      tags: [Users]
      summary: "Get the current user"
      security: [{Bearer: []}]
      responses:
        200: {description: "Current user", schema: {$ref: "#/definitions/User"}}
  /students:
    get:
      tags: [Students]
      summary: "List students"
      security: [{Bearer: []}]
      responses: {200: {description: "Students", schema: {type: array, items: {$ref: "#/definitions/Student"}}}}
    post:
      tags: [Students]
      summary: "Create a student"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/StudentBody"}]
      responses: {201: {description: "Student created", schema: {$ref: "#/definitions/Student"}}}
  /students/export.csv:
    get:
      tags: [Students]
      summary: "Export students as CSV"
      security: [{Bearer: []}]
      produces: ["text/csv"]
      responses: {200: {description: "CSV export"}}
  /students/{student_id}:
    get:
      tags: [Students]
      summary: "Get a student"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/StudentId"}]
      responses: {200: {description: "Student", schema: {$ref: "#/definitions/Student"}}}
    put:
      tags: [Students]
      summary: "Update a student"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/StudentId"}, {$ref: "#/parameters/StudentBody"}]
      responses: {200: {description: "Updated student", schema: {$ref: "#/definitions/Student"}}}
    delete:
      tags: [Students]
      summary: "Delete a student"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/StudentId"}]
      responses: {200: {description: "Student deleted"}}
  /users/students/{student_id}/promote-teacher:
    post:
      tags: [Users]
      summary: "Promote a Student account to Teacher"
      description: "Administrator only. Preserves the Student record and past session history."
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/StudentId"}, {$ref: "#/parameters/TeacherPromotionBody"}]
      responses:
        200: {description: "Account promoted", schema: {$ref: "#/definitions/User"}}
        404: {description: "Student account not found", schema: {$ref: "#/definitions/Error"}}
        409: {description: "Account is already a Teacher", schema: {$ref: "#/definitions/Error"}}
  /teachers:
    get:
      tags: [Teachers]
      summary: "List teachers"
      security: [{Bearer: []}]
      responses: {200: {description: "Teachers", schema: {type: array, items: {$ref: "#/definitions/Teacher"}}}}
    post:
      tags: [Teachers]
      summary: "Create a teacher"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/TeacherBody"}]
      responses: {201: {description: "Teacher created", schema: {$ref: "#/definitions/Teacher"}}}
  /teachers/export.csv:
    get:
      tags: [Teachers]
      summary: "Export teachers as CSV"
      security: [{Bearer: []}]
      produces: ["text/csv"]
      responses: {200: {description: "CSV export"}}
  /teachers/{teacher_id}:
    get:
      tags: [Teachers]
      summary: "Get a teacher"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/TeacherId"}]
      responses: {200: {description: "Teacher", schema: {$ref: "#/definitions/Teacher"}}}
    put:
      tags: [Teachers]
      summary: "Update a teacher"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/TeacherId"}, {$ref: "#/parameters/TeacherBody"}]
      responses: {200: {description: "Updated teacher", schema: {$ref: "#/definitions/Teacher"}}}
    delete:
      tags: [Teachers]
      summary: "Delete a teacher"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/TeacherId"}]
      responses: {200: {description: "Teacher deleted"}}
  /lessons:
    get:
      tags: [Lessons]
      summary: "List lessons"
      security: [{Bearer: []}]
      responses: {200: {description: "Lessons", schema: {type: array, items: {$ref: "#/definitions/Lesson"}}}}
    post:
      tags: [Lessons]
      summary: "Create a lesson"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/LessonBody"}]
      responses: {201: {description: "Lesson created", schema: {$ref: "#/definitions/Lesson"}}}
  /lessons/export.csv:
    get:
      tags: [Lessons]
      summary: "Export lessons as CSV"
      security: [{Bearer: []}]
      produces: ["text/csv"]
      responses: {200: {description: "CSV export"}}
  /lessons/{lesson_id}:
    get:
      tags: [Lessons]
      summary: "Get a lesson"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/LessonId"}]
      responses: {200: {description: "Lesson", schema: {$ref: "#/definitions/Lesson"}}}
    put:
      tags: [Lessons]
      summary: "Update a lesson"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/LessonId"}, {$ref: "#/parameters/LessonBody"}]
      responses: {200: {description: "Updated lesson", schema: {$ref: "#/definitions/Lesson"}}}
    delete:
      tags: [Lessons]
      summary: "Delete a lesson"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/LessonId"}]
      responses: {200: {description: "Lesson deleted"}}
  /sessions:
    get:
      tags: [Sessions]
      summary: "List sessions visible to the current user"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/SessionStudentId"}, {$ref: "#/parameters/SessionTeacherId"}, {$ref: "#/parameters/SessionLessonId"}, {$ref: "#/parameters/SessionDate"}]
      responses: {200: {description: "Sessions", schema: {type: array, items: {$ref: "#/definitions/Session"}}}}
    post:
      tags: [Sessions]
      summary: "Create a session"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/SessionBody"}]
      responses: {201: {description: "Session created", schema: {$ref: "#/definitions/Session"}}}
  /sessions/export.csv:
    get:
      tags: [Sessions]
      summary: "Export sessions as CSV"
      security: [{Bearer: []}]
      produces: ["text/csv"]
      responses: {200: {description: "CSV export"}}
  /sessions/{session_id}:
    get:
      tags: [Sessions]
      summary: "Get a session"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/SessionId"}]
      responses: {200: {description: "Session", schema: {$ref: "#/definitions/Session"}}}
    put:
      tags: [Sessions]
      summary: "Update a session"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/SessionId"}, {$ref: "#/parameters/SessionBody"}]
      responses: {200: {description: "Updated session", schema: {$ref: "#/definitions/Session"}}}
    delete:
      tags: [Sessions]
      summary: "Delete a session"
      security: [{Bearer: []}]
      parameters: [{$ref: "#/parameters/SessionId"}]
      responses: {200: {description: "Session deleted"}}
parameters:
  StudentId: {name: student_id, in: path, required: true, type: integer}
  TeacherId: {name: teacher_id, in: path, required: true, type: integer}
  LessonId: {name: lesson_id, in: path, required: true, type: integer}
  SessionId: {name: session_id, in: path, required: true, type: integer}
  SessionStudentId: {name: student_id, in: query, type: integer, description: "Admin-only filter by student ID"}
  SessionTeacherId: {name: teacher_id, in: query, type: integer, description: "Admin-only filter by teacher ID"}
  SessionLessonId: {name: lesson_id, in: query, type: integer, description: "Admin-only filter by lesson ID"}
  SessionDate: {name: session_date, in: query, type: string, format: date, description: "Admin-only filter by session date"}
  RegisterBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/RegisterRequest"}}
  LoginBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/LoginRequest"}}
  StudentBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/StudentInput"}}
  TeacherBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/TeacherInput"}}
  LessonBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/LessonInput"}}
  SessionBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/SessionInput"}}
  TeacherPromotionBody: {name: body, in: body, required: true, schema: {$ref: "#/definitions/TeacherPromotionInput"}}
definitions:
  RegisterRequest:
    type: object
    required: [name, email, password, date_of_birth]
    properties:
      name: {type: string}
      email: {type: string, format: email}
      password: {type: string, minLength: 8}
      date_of_birth: {type: string, format: date}
  LoginRequest:
    type: object
    required: [email, password]
    properties:
      email: {type: string, format: email}
      password: {type: string}
  LoginResponse:
    type: object
    properties: {auth_token: {type: string}}
  User:
    type: object
    properties:
      id: {type: integer}
      email: {type: string, format: email}
      role: {type: string, enum: [admin, student, teacher]}
      student_id: {type: integer, x-nullable: true}
      teacher_id: {type: integer, x-nullable: true}
  StudentInput:
    type: object
    required: [name, email, date_of_birth]
    properties:
      name: {type: string}
      email: {type: string, format: email}
      date_of_birth: {type: string, format: date}
  Student:
    allOf:
      - $ref: "#/definitions/StudentInput"
      - type: object
        properties: {id: {type: integer}}
  TeacherInput:
    type: object
    required: [name, specialty, experience, certification]
    properties:
      name: {type: string}
      specialty: {type: string}
      experience: {type: string}
      certification: {type: string}
  Teacher:
    allOf:
      - $ref: "#/definitions/TeacherInput"
      - type: object
        properties: {id: {type: integer}}
  TeacherPromotionInput:
    type: object
    required: [specialty, experience, certification]
    properties:
      name: {type: string}
      specialty: {type: string}
      experience: {type: string}
      certification: {type: string}
  LessonInput:
    type: object
    required: [name, sku, stock_quantity]
    properties:
      name: {type: string}
      sku: {type: string}
      stock_quantity: {type: integer, minimum: 0}
  Lesson:
    allOf:
      - $ref: "#/definitions/LessonInput"
      - type: object
        properties: {id: {type: integer}}
  SessionInput:
    type: object
    required: [session_date, student_id, teacher_id, lesson_id]
    properties:
      session_date: {type: string, format: date}
      student_id: {type: integer}
      teacher_id: {type: integer}
      lesson_id: {type: integer}
      notes: {type: string}
  Session:
    allOf:
      - $ref: "#/definitions/SessionInput"
      - type: object
        properties:
          id: {type: integer}
          student: {$ref: "#/definitions/StudentSummary"}
          teacher: {$ref: "#/definitions/TeacherSummary"}
          lesson: {$ref: "#/definitions/LessonSummary"}
  StudentSummary:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
      email: {type: string, format: email}
  TeacherSummary:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
      specialty: {type: string}
  LessonSummary:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
      sku: {type: string}
  Error:
    type: object
    properties:
      error: {type: string}
      details: {type: string}
